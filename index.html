<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="robots" content="noindex,nofollow,noarchive">
    <meta http-equiv="refresh" content="0;url=https://neximahub.ru/">
    <link rel="canonical" href="https://neximahub.ru/">
    <title>NEXIMA Hub — официальный сайт</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, Arial, sans-serif;
        background: #f4f0e4;
        color: #0d1c36;
      }

      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        min-height: 100svh;
        margin: 0;
        place-items: center;
        background-image:
          linear-gradient(rgba(13, 28, 54, 0.06) 1px, transparent 1px),
          linear-gradient(90deg, rgba(13, 28, 54, 0.06) 1px, transparent 1px);
        background-size: 32px 32px;
      }

      main {
        width: min(680px, calc(100% - 32px));
        padding: clamp(28px, 6vw, 64px);
        border: 1px solid rgba(13, 28, 54, 0.18);
        background: rgba(255, 255, 255, 0.78);
        box-shadow: 0 24px 80px rgba(13, 28, 54, 0.1);
        clip-path: polygon(0 0, calc(100% - 24px) 0, 100% 24px, 100% 100%, 24px 100%, 0 calc(100% - 24px));
      }

      .label {
        margin: 0 0 18px;
        color: #0755cf;
        font: 600 12px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(32px, 7vw, 72px);
        line-height: 0.95;
        letter-spacing: -0.05em;
      }

      p {
        max-width: 42rem;
        margin: 24px 0 0;
        color: #596881;
        font-size: clamp(16px, 2.3vw, 21px);
        line-height: 1.55;
      }

      a {
        display: inline-flex;
        margin-top: 28px;
        padding: 16px 24px;
        color: #fff;
        background: #0755cf;
        text-decoration: none;
        font-weight: 700;
        clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 10px 100%, 0 calc(100% - 10px));
      }
    </style>
    <script>
      window.location.replace("https://neximahub.ru/");
    </script>
  </head>
  <body>
    <main>
      <p class="label">NEXIMA Hub · новый адрес</p>
      <h1>Мы переехали</h1>
      <p>Официальный сайт маркетингового коммуникационного агентства NEXIMA Hub теперь работает по адресу neximahub.ru.</p>
      <a href="https://neximahub.ru/">Перейти на neximahub.ru →</a>
    </main>
  </body>
</html>
