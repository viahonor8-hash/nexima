name: Temporary Svoy Krug photo package

on:
  pull_request:
    paths:
      - 'temp-photo-trigger.txt'

permissions:
  contents: read

jobs:
  build-photo-package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Install dependencies
        run: python -m pip install --quiet requests pillow
      - name: Download and validate photos
        shell: bash
        env:
          MANIFEST_GZ_B64: ""
        run: |
          python - <<'PYCODE'
          import base64, csv, gzip, hashlib, io, json, os, time, zipfile
          from pathlib import Path
          import requests
          from PIL import Image

          manifest = json.loads(gzip.decompress(base64.b64decode(os.environ['MANIFEST_GZ_B64'])))
          root = Path('SVOY_KRUG_IMAGES')
          root.mkdir(exist_ok=True)
          s = requests.Session()
          s.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126 Safari/537.36',
              'Accept': 'image/avif,image/webp,image/apng,image/svg+xml,image/*,*/*;q=0.8',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
          })
          report=[]
          for i,item in enumerate(manifest,1):
              folder=root/item['folder']; folder.mkdir(parents=True,exist_ok=True)
              target=folder/item['file_name']
              ok=False; err=''
              candidates=[item['url']]
              if item['url'].startswith('https://'):
                  candidates.append('http://'+item['url'][8:])
              for url in candidates:
                  for attempt in range(1,4):
                      try:
                          headers={'Referer': item.get('source_page_url','')} if item.get('source_page_url') else {}
                          r=s.get(url,headers=headers,timeout=(20,90),allow_redirects=True)
                          r.raise_for_status()
                          data=r.content
                          if len(data)<20000: raise ValueError(f'too small bytes={len(data)} content-type={r.headers.get("content-type")}')
                          im=Image.open(io.BytesIO(data)); im.verify()
                          im=Image.open(io.BytesIO(data)); w,h=im.size
                          if w<1000 or h<600: raise ValueError(f'too small dimensions {w}x{h}')
                          im=Image.open(io.BytesIO(data)).convert('RGB')
                          im.save(target,'JPEG',quality=92,optimize=True)
                          final=target.read_bytes()
                          report.append({'folder':item['folder'],'file_name':item['file_name'],'status':'OK','width':w,'height':h,'bytes':len(final),'source_url':item['url'],'source_page_url':item.get('source_page_url',''),'sha256':hashlib.sha256(final).hexdigest(),'error':''})
                          print(f'[{i:02d}/{len(manifest)}] OK {item["file_name"]} {w}x{h}')
                          ok=True
                          break
                      except Exception as e:
                          err=f'{type(e).__name__}: {e}'
                          print(f'[{i:02d}/{len(manifest)}] attempt {attempt} failed: {err}')
                          time.sleep(attempt*2)
                  if ok: break
              if not ok:
                  report.append({'folder':item['folder'],'file_name':item['file_name'],'status':'FAILED','width':'','height':'','bytes':0,'source_url':item['url'],'source_page_url':item.get('source_page_url',''),'sha256':'','error':err})
          fields=['folder','file_name','status','width','height','bytes','source_url','source_page_url','sha256','error']
          with open(root/'DOWNLOAD_REPORT.csv','w',encoding='utf-8-sig',newline='') as f:
              w=csv.DictWriter(f,fieldnames=fields); w.writeheader(); w.writerows(report)
          good=sum(x['status']=='OK' for x in report)
          failed=len(report)-good
          (root/'README.txt').write_text(f'Фотографии: {good}\nНе загружено: {failed}\nВсего источников: {len(report)}\n',encoding='utf-8')
          with zipfile.ZipFile('SVOY_KRUG_IMAGES.zip','w',zipfile.ZIP_DEFLATED,compresslevel=6) as z:
              for p in root.rglob('*'):
                  if p.is_file(): z.write(p,p.relative_to(root.parent))
          print(f'FINAL OK={good} FAILED={failed}')
          if good < 30: raise SystemExit(f'Only {good} images downloaded')
          PYCODE
      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: SVOY_KRUG_IMAGES
          path: SVOY_KRUG_IMAGES.zip
          retention-days: 1
          if-no-files-found: error
