name: Temporary tour photo downloader

on:
  push:
    paths:
      - '.github/workflows/temp-download-tour-photos.yml'
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download and validate images
        shell: bash
        env:
          MANIFEST_GZ_B64: ""
        run: |
          python - <<'PYCODE'
          import base64, csv, gzip, hashlib, io, json, os, time, zipfile
          from pathlib import Path
          import requests
          from PIL import Image

          manifest = json.loads(gzip.decompress(base64.b64decode(os.environ['MANIFEST_GZ_B64'])))
          out = Path('tour_photos'); out.mkdir(exist_ok=True)
          report = []
          session = requests.Session()
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126 Safari/537.36',
              'Accept': 'image/avif,image/webp,image/apng,image/svg+xml,image/*,*/*;q=0.8',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
          })

          def candidate_urls(url):
              result=[url]
              alt = url.replace('https://','http://',1) if url.startswith('https://') else url.replace('http://','https://',1)
              if alt != url: result.append(alt)
              return result

          for idx, item in enumerate(manifest, 1):
              name, url = item['file_name'], item['url']
              referer = item.get('source_page_url') or ''
              row = {'index':idx,'file_name':name,'status':'FAILED','bytes':0,'width':'','height':'','sha256':'','url':url,'error':''}
              last_error=''
              for attempt_url in candidate_urls(url):
                  for attempt in range(1,4):
                      try:
                          headers={'Referer':referer} if referer else {}
                          r=session.get(attempt_url,headers=headers,timeout=(20,90),allow_redirects=True)
                          r.raise_for_status(); data=r.content
                          if len(data)<1024: raise ValueError(f'too small: {len(data)} bytes')
                          im=Image.open(io.BytesIO(data)); im.verify()
                          im=Image.open(io.BytesIO(data)); width,height=im.size
                          if width<300 or height<200: raise ValueError(f'too small dimensions: {width}x{height}')
                          (out/name).write_bytes(data)
                          row.update(status='OK',bytes=len(data),width=width,height=height,sha256=hashlib.sha256(data).hexdigest(),url=r.url,error='')
                          print(f'[{idx:02d}/{len(manifest)}] OK {name} {width}x{height} {len(data)} bytes')
                          break
                      except Exception as e:
                          last_error=f'{type(e).__name__}: {e}'
                          print(f'[{idx:02d}/{len(manifest)}] FAIL attempt {attempt} {attempt_url}: {last_error}')
                          time.sleep(attempt*2)
                  if row['status']=='OK': break
              if row['status']!='OK': row['error']=last_error
              report.append(row)

          with open('download_report.csv','w',encoding='utf-8-sig',newline='') as f:
              fields=['index','file_name','status','bytes','width','height','sha256','url','error']
              w=csv.DictWriter(f,fieldnames=fields); w.writeheader(); w.writerows(report)
          ok=sum(r['status']=='OK' for r in report); failed=len(report)-ok
          Path('SUMMARY.txt').write_text(f'Downloaded: {ok}\nFailed: {failed}\nTotal: {len(report)}\n',encoding='utf-8')
          with zipfile.ZipFile('TOUR_PHOTOS.zip','w',zipfile.ZIP_DEFLATED,compresslevel=6) as z:
              for p in sorted(out.iterdir()): z.write(p,arcname=p.name)
              z.write('download_report.csv'); z.write('SUMMARY.txt')
          print(f'FINAL downloaded={ok} failed={failed}')
          if ok==0: raise SystemExit('No images downloaded')
          PYCODE
      - name: Upload photo archive
        uses: actions/upload-artifact@v4
        with:
          name: TOUR_PHOTOS_ARCHIVE
          path: |
            TOUR_PHOTOS.zip
            download_report.csv
            SUMMARY.txt
          if-no-files-found: error
          retention-days: 1
